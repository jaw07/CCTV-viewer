# Taiwan CCTV Viewer Configuration

# Detection settings
detection:
  # yolov8n on CPU, yolov8m where a GPU is available. Measured on the Orin:
  # CPU  n=259ms  s=356ms  m=582ms
  # GPU  n=18.7ms s=18.4ms m=22.6ms   <- m is near-free on GPU
  model: yolov8n.pt
  confidence_threshold: 0.6  # 60% confidence for vehicle detection
  imgsz: 640                 # inference size for road cameras

  # Coastal cameras are a different problem: small, densely-packed vessels seen
  # obliquely from above, rather than a car crossing a carriageway. Measured on
  # a daylight Fugang harbour frame (~25-30 vessels visible, yolov8m on GPU):
  #   imgsz=640  conf=0.60 -> 0 boats, plus a false "train"
  #   imgsz=1280 conf=0.35 -> 2 boats   (49ms)
  #   imgsz=1920 conf=0.25 -> 5 boats   (133ms), with false cars
  # Even at best that is ~17% recall - COCO's boat class is trained on large,
  # isolated, side-on boats, so treat the badge as "possible vessel activity"
  # rather than a count. Road detection is untouched by these.
  coastal:
    confidence_threshold: 0.35
    imgsz: 1280
    # Coastal only. On the reference harbour frame at imgsz=1280/conf=0.35:
    #   yolov8m  2 boats   50ms
    #   yolov8l  3 boats   69ms
    #   yolov8x  4 boats  152ms
    # Road cameras keep the main model - yolov8x costs 1.5x there for no gain,
    # since vehicle detection already works. Leave unset to reuse the main model.
    model: yolov8x.pt
  min_box_size: 20  # Minimum bounding box size in pixels
  vehicle_classes:  # COCO dataset class IDs
    - 2  # car
    - 5  # bus
    - 7  # truck

  # Additional detection classes (enable as needed)
  # Coastal/harbour cameras see vessels, not cars - adds COCO class 8 (boat).
  detect_boats: true
  detect_pedestrians: false
  detect_motorcycles: false
  detect_bicycles: false

  # Object tracking settings
  tracking:
    enabled: true
    max_age: 30  # Maximum frames to keep track alive
    min_hits: 3  # Minimum detections before track is confirmed
    iou_threshold: 0.3  # IOU threshold for matching

# Performance settings
performance:
  batch_size: 50  # Number of feeds per batch (reduced from 240 to avoid overwhelming servers)
  worker_threads: 8  # ThreadPoolExecutor workers
  selective_skip_interval: 2  # Re-check empty feeds every N cycles

  # Connection pool settings
  http:
    max_connections: 300
    max_keepalive: 250
    keepalive_expiry: 60  # seconds
    timeout: 15.0  # Increased from 5.0 to 15.0 seconds
    connect_timeout: 5.0  # Increased from 2.0 to 5.0 seconds

# Video recording
recording:
  enabled: false
  on_vehicle_detection: true
  duration: 30  # seconds
  format: "mp4"
  codec: "h264"
  output_dir: "./recordings"
  retention_days: 7  # Auto-delete after N days

# Database settings
database:
  enabled: true
  type: "sqlite"  # sqlite, postgresql, mysql
  path: "./data/cctv_data.db"  # For SQLite
  # For PostgreSQL/MySQL:
  # host: "localhost"
  # port: 5432
  # username: "user"
  # password: "pass"
  # database: "cctv"

  # Data retention
  retention:
    detections: 30  # days
    feed_history: 90  # days

# WebSocket settings
websocket:
  enabled: true
  heartbeat_interval: 30  # seconds
  max_connections: 100

# API settings
api:
  enable_cors: true
  enable_gzip: true
  rate_limit: 1000  # requests per minute

# Alerting (future feature)
alerts:
  enabled: false
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    from_address: "alerts@example.com"
    to_addresses:
      - "admin@example.com"
  webhook:
    enabled: false
    url: ""

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json, text
  file: "./logs/cctv.log"
  max_size_mb: 100
  backup_count: 5

# Stream Out (existing feature)
stream_out:
  enabled: false
  format: "cot"  # cot, lattice
  cot:
    ip: "127.0.0.1"
    port: 8087
  lattice:
    url: ""
    token: ""
    sandbox_token: ""
    integration_name: "taiwan-cctv"

# Additional camera sources beyond the Taiwan Highway Bureau XML feed.
sources:
  # Central Weather Administration coastal cameras (official, YouTube live).
  # These are pulled as still frames by backend/youtube_frames.py so they flow
  # through the same detection pipeline; requires yt-dlp and ffmpeg on PATH.
  # CWA mints a new video ID for every stream daily, so IDs are re-resolved
  # from the official channel on id_refresh_interval.
  cwa_coastal:
    enabled: true
    west_only: false      # true = Taiwan Strait facing cameras only
    frame_interval: 120   # seconds between frame grabs per camera
    # Each grab spawns yt-dlp + ffmpeg; with ~120 cameras, unbounded
    # concurrency would swamp the host.
    max_concurrent_grabs: 4
    # Fallback only. Capture time is normally read from the clock the camera
    # burns into the frame (authoritative). This offset is applied only when a
    # camera has no on-image clock, to compensate for YouTube live delivery lag
    # (measured 19-100s, varies by camera and network).
    stream_latency_seconds: 0
    id_refresh_interval: 3600
