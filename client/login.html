<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; Taiwan Highway CCTV Viewer</title>
    <link rel="stylesheet" href="styles/common.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
            background:
                radial-gradient(ellipse at top, rgba(0, 102, 204, 0.12), transparent 60%),
                var(--color-bg-primary);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-2xl);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
        }

        .login-brand svg { color: var(--color-accent); flex-shrink: 0; }

        .login-brand h1 {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
        }

        .login-brand p {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .field { margin-bottom: var(--spacing-lg); }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.02em;
        }

        .field input {
            width: 100%;
            padding: 10px var(--spacing-md);
            background: var(--color-bg-input);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .field input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-light);
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            margin-top: var(--spacing-sm);
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        .login-btn:hover:not(:disabled) { background: var(--color-accent-hover); }

        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-error {
            display: none;
            margin-bottom: var(--spacing-lg);
            padding: 10px var(--spacing-md);
            background: var(--color-error-bg);
            border: 1px solid var(--color-error);
            border-radius: var(--radius-md);
            color: var(--color-error);
            font-size: 13px;
        }

        .login-error.visible { display: block; }

        .login-foot {
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-light);
            font-size: 11px;
            color: var(--color-text-tertiary);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 7l-7 5 7 5V7z"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <div>
                <h1>Taiwan Highway CCTV</h1>
                <p>Sign in to continue</p>
            </div>
        </div>

        <div id="loginError" class="login-error" role="alert" aria-live="assertive"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>

        <div class="login-foot">Authorised access only &middot; activity is logged</div>
    </main>

    <script>
        // Same-origin behind the tunnel; falls back to the dev backend port when
        // the static client is served separately on :8000.
        const API_BASE = window.location.port === '8000'
            ? `${window.location.protocol}//${window.location.hostname}:8001`
            : '';

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('loginError');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('visible');
        }

        // Where to land after a successful sign-in. The middleware passes the
        // originally requested path as base64url in ?next=.
        function nextTarget() {
            const raw = new URLSearchParams(window.location.search).get('next');
            if (!raw) return 'index.html';
            try {
                const decoded = atob(raw.replace(/-/g, '+').replace(/_/g, '/'));
                // Only accept same-site relative paths, never an absolute URL.
                if (decoded.startsWith('/') && !decoded.startsWith('//')) return decoded;
            } catch (e) { /* fall through to the default */ }
            return 'index.html';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (response.ok) {
                    window.location.replace(nextTarget());
                    return;
                }

                const body = await response.json().catch(() => ({}));
                showError(body.message || 'Sign-in failed. Check your credentials.');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            } catch (err) {
                showError('Could not reach the server. Try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
